<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <title>Graphiste &amp; RA</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script type="importmap">
    { "imports": {
        "three": "../vendor/three.module.js",
        "three/addons/": "../vendor/addons/",
        "mindar-image-three": "../vendor/mindar-image-three.prod.js"
    } }
  </script>
</head>
<body>
  <div id="ar"></div>

  <!-- une seule balise vidéo réutilisée pour toutes les affiches (une seule joue à la fois) -->
  <video id="v" playsinline webkit-playsinline preload="none"></video>

  <section id="accueil">
    <div class="carte">
      <div class="logo" aria-hidden="true">◎</div>
      <h1 id="titre">Graphiste &amp; RA</h1>
      <p id="consigne">Visez une affiche</p>
      <button id="demarrer" class="grand" type="button">Démarrer la caméra</button>
      <p id="etat" class="petit">version v5</p>
    </div>
  </section>

  <div id="scan" hidden><span class="pastille"></span><span id="scanTexte">Recherche d'une affiche…</span></div>
  <button id="quitter" type="button" hidden>✕ Quitter</button>
  <button id="fsnav" type="button" hidden aria-label="Plein écran du navigateur">⛶ Plein écran</button>
  <div id="chip" hidden></div>
  <button id="son" type="button" hidden>🔊 Activer le son</button>

  <div id="barre" hidden>
    <button id="pp" type="button" aria-label="Lecture / pause">⏸</button>
    <button id="mute" type="button" aria-label="Son">🔊</button>
    <input id="prog" type="range" min="0" max="1000" value="0" aria-label="Progression">
    <button id="rejouer" type="button" hidden>↻ Rejouer</button>
    <button id="plein" type="button" aria-label="Voir la vidéo en plein écran">⤢ Vidéo</button>
  </div>
  <button id="retour" type="button" hidden>◀ Retour RA</button>

  <section id="erreur" hidden>
    <div class="carte">
      <h2>Oups…</h2>
      <p id="erreurTexte"></p>
      <button id="reessayer" class="grand" type="button">Réessayer</button>
    </div>
  </section>

  <script type="module" src="../app.js"></script>
</body>
</html>
